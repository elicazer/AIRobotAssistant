<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sunny Avatar</title>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #202436; overflow: hidden; }
    #canvas-wrap { width: 100vw; height: 100vh; }
    .diagnostics { display: none; }
    body.debug .diagnostics { display: block; }
    #status {
      position: fixed; top: 10px; left: 10px; z-index: 10;
      font-family: monospace; font-size: 13px; color: #cfe3ff;
      background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 6px;
    }
    #hud {
      position: fixed; bottom: 10px; left: 10px; z-index: 10;
      font-family: monospace; font-size: 12px; color: #9fd;
      background: rgba(0,0,0,0.5); padding: 6px 10px; border-radius: 6px;
    }
  </style>
  <!-- Pinned, mutually compatible versions: three r160 + three-vrm v3 -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.1.4/lib/three-vrm.module.min.js"
    }
  }
  </script>
</head>
<body>
  <div id="status" class="diagnostics">loading…</div>
  <div id="hud" class="diagnostics">viseme: neutral | eye: (0,0) | blink: 0</div>
  <div id="canvas-wrap"></div>

  <script type="module">
    if (new URLSearchParams(window.location.search).has('debug')) {
      document.body.classList.add('debug');
    }

    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    const statusEl = document.getElementById('status');
    const hudEl = document.getElementById('hud');

    // Expose state so Playwright / external code can read progress.
    window.__vrmState = {
      loaded: false,
      error: null,
      expressions: [],
      socketConnected: false,
    };

    const wrap = document.getElementById('canvas-wrap');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    wrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202436);

    // Camera framed on the head/upper body.
    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20);
    camera.position.set(0, 1.35, 1.3);
    camera.lookAt(0, 1.35, 0);

    // Lighting
    const dir = new THREE.DirectionalLight(0xffffff, Math.PI);
    dir.position.set(1, 2, 2);
    scene.add(dir);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6 * Math.PI));

    let currentVrm = null;
    const lookTarget = new THREE.Object3D(); // eyes track this (scene-space)
    scene.add(lookTarget);

    // ---- Control state driven by external commands ----
    const control = {
      viseme: 'neutral',   // one of aa/ih/ou/ee/oh/neutral
      visemeWeight: 0,
      eyeX: 0,             // -1..1  (left..right)
      eyeY: 0,             // -1..1  (down..up)
      blink: 0,            // 0..1
    };

    const VISEMES = ['aa', 'ih', 'ou', 'ee', 'oh'];

    function updateHud() {
      hudEl.textContent =
        `viseme: ${control.viseme} (${control.visemeWeight.toFixed(2)}) | ` +
        `eye: (${control.eyeX.toFixed(2)},${control.eyeY.toFixed(2)}) | ` +
        `blink: ${control.blink.toFixed(2)}`;
    }

    // ---- Public command API (also used by Playwright) ----
    window.avatar = {
      setViseme(name, weight = 1.0) {
        control.viseme = name;
        control.visemeWeight = Math.max(0, Math.min(1, weight));
        updateHud();
      },
      setEye(x, y) {
        control.eyeX = Math.max(-1, Math.min(1, x));
        control.eyeY = Math.max(-1, Math.min(1, y));
        updateHud();
      },
      setBlink(v) {
        control.blink = Math.max(0, Math.min(1, v));
        updateHud();
      },
      listExpressions() {
        return window.__vrmState.expressions;
      }
    };

    // Map the existing amplitude-based mouth categories to VRM vowel shapes.
    // A future phoneme controller can emit aa/ih/ou/ee/oh directly.
    const VISEME_MAP = {
      CLOSED: 'neutral',
      NARROW: 'ih',
      ROUNDED: 'ou',
      MEDIUM: 'ee',
      MEDIUM_OPEN: 'oh',
      WIDE: 'aa',
      neutral: 'neutral',
      aa: 'aa',
      ih: 'ih',
      ou: 'ou',
      ee: 'ee',
      oh: 'oh',
    };
    const FALLBACK_WEIGHTS = {
      CLOSED: 0.0,
      NARROW: 0.15,
      ROUNDED: 0.20,
      MEDIUM: 0.30,
      MEDIUM_OPEN: 0.45,
      WIDE: 0.65,
    };

    const socket = io();
    window.__avatarSocket = socket;
    let blinkTimer = null;
    let lastExplicitGazeAt = -Infinity;

    socket.on('connect', () => {
      window.__vrmState.socketConnected = true;
      if (window.__vrmState.loaded) statusEl.textContent = 'loaded ✓ connected';
    });

    socket.on('disconnect', () => {
      window.__vrmState.socketConnected = false;
      statusEl.textContent = 'avatar loaded; control server disconnected';
    });

    socket.on('viseme_update', (data = {}) => {
      // Prefer the phoneme-accurate VRM viseme from the Python driver.
      if (typeof data.vrm === 'string') {
        const w = Number.isFinite(data.vrm_weight)
          ? data.vrm_weight
          : (Number.isFinite(data.intensity) ? data.intensity : 1.0);
        window.avatar.setViseme(data.vrm, w);
        return;
      }
      // Fallback: map the amplitude-based category to a VRM vowel.
      const source = typeof data.viseme === 'string' ? data.viseme : 'CLOSED';
      const target = VISEME_MAP[source] || VISEME_MAP[source.toLowerCase()] || 'neutral';
      const suppliedIntensity = data.intensity;
      const weight = typeof suppliedIntensity === 'number' && Number.isFinite(suppliedIntensity)
        ? suppliedIntensity
        : (FALLBACK_WEIGHTS[source] ?? (target === 'neutral' ? 0.0 : 1.0));
      window.avatar.setViseme(target, weight);
    });

    socket.on('eye_position_update', (data = {}) => {
      if (Number.isFinite(data.gaze_x) && Number.isFinite(data.gaze_y)) {
        lastExplicitGazeAt = performance.now();
        window.avatar.setEye(data.gaze_x, data.gaze_y);
        return;
      }

      // Ignore the hardware-angle duplicate that immediately follows an explicit
      // face-tracking gaze event. Keep this fallback for older/custom producers.
      if (performance.now() - lastExplicitGazeAt < 100) return;

      const xs = [data.left_x, data.right_x].filter(Number.isFinite);
      const ys = [data.left_y, data.right_y].filter(Number.isFinite);
      if (xs.length && ys.length) {
        const x = xs.reduce((sum, value) => sum + value, 0) / xs.length;
        const y = ys.reduce((sum, value) => sum + value, 0) / ys.length;
        window.avatar.setEye((x - 90) / 30, (y - 90) / 30);
      }
    });

    socket.on('blink_eyes', () => {
      if (blinkTimer !== null) window.clearTimeout(blinkTimer);
      window.avatar.setBlink(1);
      blinkTimer = window.setTimeout(() => {
        window.avatar.setBlink(0);
        blinkTimer = null;
      }, 120);
    });

    const loader = new GLTFLoader();
    loader.register((parser) => new VRMLoaderPlugin(parser));

    // The server resolves this fixed endpoint to the configured local VRM file.
    const MODEL_URL = {{ model_url | tojson }};

    loader.load(
      MODEL_URL,
      (gltf) => {
        const vrm = gltf.userData.vrm;
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        // VRM 0.x models face -Z; rotate 180° to face the camera. No-op for VRM 1.0.
        if (vrm.meta && vrm.meta.metaVersion === '0') {
          VRMUtils.rotateVRM0(vrm);
        }

        scene.add(vrm.scene);
        currentVrm = vrm;

        // Frame the camera on the head using the actual head bone position.
        const headNode = vrm.humanoid && vrm.humanoid.getNormalizedBoneNode
          ? vrm.humanoid.getNormalizedBoneNode('head')
          : null;
        let headY = 1.35;
        if (headNode) {
          const p = new THREE.Vector3();
          headNode.getWorldPosition(p);
          headY = p.y;
        }
        // Relax arms down from the default T/A-pose.
        const hum = vrm.humanoid;
        if (hum && hum.getNormalizedBoneNode) {
          const lUp = hum.getNormalizedBoneNode('leftUpperArm');
          const rUp = hum.getNormalizedBoneNode('rightUpperArm');
          const lLow = hum.getNormalizedBoneNode('leftLowerArm');
          const rLow = hum.getNormalizedBoneNode('rightLowerArm');
          if (lUp) lUp.rotation.z = 1.4;
          if (rUp) rUp.rotation.z = -1.4;
          if (lLow) lLow.rotation.z = 0.15;
          if (rLow) rLow.rotation.z = -0.15;
          if (vrm.update) vrm.update(0);
        }

        // Pull back and aim near the top of the head so the full head +
        // shoulders are framed without clipping the crown.
        camera.position.set(0, headY + 0.08, 0.95);
        camera.lookAt(0, headY + 0.02, 0);
        lookTarget.position.set(0, headY, 1.0);

        // Point the eyes at our movable target.
        if (vrm.lookAt) {
          vrm.lookAt.target = lookTarget;
        }
        window.__vrmHeadY = headY;

        const exprNames = vrm.expressionManager
          ? vrm.expressionManager.expressions.map(e => e.expressionName)
          : [];
        window.__vrmState.expressions = exprNames;
        window.__vrmState.loaded = true;

        statusEl.textContent = window.__vrmState.socketConnected
          ? `loaded ✓ connected (${exprNames.length} expressions)`
          : `loaded ✓ waiting for control server (${exprNames.length} expressions)`;
        updateHud();
      },
      (progress) => {
        if (progress.total) {
          const pct = Math.round((progress.loaded / progress.total) * 100);
          statusEl.textContent = `loading… ${pct}%`;
        }
      },
      (error) => {
        console.error(error);
        window.__vrmState.error = String(error);
        statusEl.textContent = 'ERROR: ' + error;
      }
    );

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      if (currentVrm) {
        const em = currentVrm.expressionManager;
        if (em) {
          // Reset visemes, apply the active one.
          for (const v of VISEMES) em.setValue(v, 0);
          if (VISEMES.includes(control.viseme)) {
            em.setValue(control.viseme, control.visemeWeight);
          }
          // Blink
          em.setValue('blink', control.blink);
        }

        // Eye aim: move the look target relative to the head, in front of the face (+Z).
        const hy = window.__vrmHeadY || 1.35;
        lookTarget.position.set(control.eyeX * 0.4, hy + control.eyeY * 0.25, 1.0);

        currentVrm.update(delta);
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
